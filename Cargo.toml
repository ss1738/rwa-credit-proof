[package]
name = "credit-solvency-core"
version = "0.1.0"
edition = "2021"
description = "The statement a tokenized private-credit fund must prove before it mints: a servicer-signed loan tape is solvent and fully KYC'd, in zero-knowledge. Plain-Rust reference; lifts into a zkVM guest unchanged."

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ZK: Groth16 over BN254 (the curve Solana verifies via alt_bn128 syscalls)
ark-bn254 = "0.4"
ark-groth16 = "0.4"
ark-r1cs-std = "0.4"
ark-relations = "0.4"
ark-snark = "0.4"
ark-ec = "0.4"
ark-ff = "0.4"
ark-serialize = "0.4"
ark-std = "0.4"

# Solana's on-chain BN254 pairing (native fallback runs the same arithmetic the syscall does)
solana-bn254 = "2"

[[bin]]
name = "demo"
path = "src/demo.rs"

[[bin]]
name = "prove"
path = "src/prove.rs"

[[bin]]
name = "onchain"
path = "src/onchain.rs"

[profile.release]
opt-level = 3
