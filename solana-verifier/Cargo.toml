# Standalone workspace so it isn't pulled into the parent host crate.
[workspace]

[package]
name = "solana-verifier"
version = "0.1.0"
edition = "2021"
description = "On-chain Groth16 verifier for the private-credit solvency proof (BN254 via alt_bn128)."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "2"
solana-bn254 = "2"

[dev-dependencies]
credit-solvency-core = { path = ".." }
solana-program-test = "2"
solana-sdk = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
