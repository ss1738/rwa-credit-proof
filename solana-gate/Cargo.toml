[workspace]

[package]
name = "caledren-solana-gate"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pilot proof-approval gate: pinned key, servicer authorization, freshness and replay checks"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
solana-program = "2"
solana-verifier = { path = "../solana-verifier", features = ["no-entrypoint"] }
caledren-gate-protocol = { path = "../gate-protocol" }

[dev-dependencies]
credit-solvency-core = { path = ".." }
solana-program-test = "2"
solana-sdk = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
bincode = "1"
